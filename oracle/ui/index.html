<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Oracle — Predictive Intelligence</title>
<style>
  :root { --green: #00ff41; --dark: #0a0f0a; --darker: #050805; --dim: #008f22; --glow: #00ff4188; --red: #ff3333; --yellow: #ffcc00; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--darker); color: var(--green); font-family: 'Courier New', monospace; min-height: 100vh; display: flex; flex-direction: column; }
  .scanline { position: fixed; top: 0; left: 0; width: 100%; height: 3px; background: var(--glow); opacity: 0.3; animation: scan 4s linear infinite; pointer-events: none; z-index: 999; }
  @keyframes scan { 0% { top: -4px; } 100% { top: 100%; } }
  header { padding: 1.5rem; text-align: center; border-bottom: 1px solid var(--dim); }
  header h1 { font-size: 1.8rem; letter-spacing: 0.3em; text-shadow: 0 0 15px var(--glow); }
  header p { color: var(--dim); font-size: 0.8rem; margin-top: 0.25rem; }
  nav { display: flex; justify-content: center; gap: 1rem; padding: 0.75rem; border-bottom: 1px solid var(--dark); }
  nav a { color: var(--dim); text-decoration: none; font-size: 0.8rem; padding: 0.25rem 0.75rem; border: 1px solid transparent; border-radius: 4px; }
  nav a:hover, nav a.active { color: var(--green); border-color: var(--dim); }
  main { flex: 1; max-width: 900px; margin: 0 auto; width: 100%; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
  .input-area { display: flex; gap: 0.5rem; }
  .input-area textarea {
    flex: 1; background: var(--dark); border: 1px solid var(--dim); color: var(--green);
    padding: 0.75rem; font-family: inherit; font-size: 0.9rem; resize: vertical;
    min-height: 60px; border-radius: 4px;
  }
  .input-area textarea:focus { outline: none; border-color: var(--green); box-shadow: 0 0 10px var(--glow); }
  .input-area button {
    background: var(--dim); border: none; color: var(--darker); padding: 0 1.5rem;
    font-family: inherit; font-weight: bold; cursor: pointer; border-radius: 4px;
    font-size: 0.9rem; letter-spacing: 0.1em; transition: all 0.2s;
  }
  .input-area button:hover { background: var(--green); box-shadow: 0 0 15px var(--glow); }
  .input-area button:disabled { opacity: 0.3; }
  .spinner { display: none; text-align: center; padding: 1rem; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  .error { color: var(--red); padding: 0.5rem; display: none; }
  .prediction-card {
    background: var(--dark); border: 1px solid var(--dim); padding: 1.25rem; border-radius: 4px; margin-bottom: 0.75rem;
  }
  .prediction-card .statement { font-size: 1rem; margin-bottom: 0.5rem; }
  .prediction-card .meta { color: var(--dim); font-size: 0.75rem; display: flex; gap: 1rem; flex-wrap: wrap; }
  .bar-container { height: 6px; background: var(--darker); margin: 0.5rem 0; border-radius: 2px; }
  .bar-fill { height: 100%; border-radius: 2px; transition: width 0.5s; }
  .reasoning { color: var(--dim); font-size: 0.8rem; margin-top: 0.5rem; }
  .history { margin-top: 1rem; }
  .history-item {
    padding: 0.5rem; border-bottom: 1px solid var(--dark); font-size: 0.8rem;
    display: flex; justify-content: space-between;
  }
  .history-item.resolved-correct { border-left: 2px solid var(--green); }
  .history-item.resolved-incorrect { border-left: 2px solid var(--red); }
  .tabs { display: none; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  footer { text-align: center; padding: 1rem; color: var(--dim); font-size: 0.7rem; border-top: 1px solid var(--dim); }
</style>
</head>
<body>
<div class="scanline"></div>
<header>
  <h1>T H E &nbsp; O R A C L E</h1>
  <p>PREDICTIVE INTELLIGENCE ENGINE // AZURE FOUNDRY (GPT-5.4)</p>
</header>
<nav>
  <a href="#" class="active" onclick="switchTab('predict')">▸ PREDICT</a>
  <a href="#" onclick="switchTab('history')">▸ HISTORY</a>
  <a href="#" onclick="switchTab('calibration')">▸ CALIBRATION</a>
  <a href="/dashboard/index.html">▸ DASHBOARD</a>
</nav>
<main>
  <div class="tab-content active" id="tab-predict">
    <div class="input-area">
      <textarea id="question" placeholder="Ask The Oracle...

Example: Will Apple announce new hardware at WWDC 2026?
Example: Will NVDA stock reach $200 by July?
Example: Which AI framework will dominate enterprise by 2027?"></textarea>
      <button id="askBtn" onclick="ask()">▸ CONSULT</button>
    </div>
    <div class="error" id="error"></div>
    <div class="spinner" id="spinner">CONSULTING THE ORACLE...</div>
    <div id="predictions"></div>
  </div>
  <div class="tab-content" id="tab-history">
    <div class="spinner" id="histSpinner">LOADING...</div>
    <div class="history" id="historyList"></div>
  </div>
  <div class="tab-content" id="tab-calibration">
    <div class="spinner" id="calSpinner">LOADING...</div>
    <div id="calibrationData"></div>
  </div>
</main>
<footer>THE ORACLE v0.1.0 // AZURE CONTAINER APPS (EASTUS2)</footer>
<script>
const API = '/v1';

async function ask() {
  const q = document.getElementById('question').value.trim();
  if (!q) return;

  const btn = document.getElementById('askBtn');
  btn.disabled = true; btn.textContent = '...';
  document.getElementById('error').style.display = 'none';
  document.getElementById('spinner').style.display = 'block';
  document.getElementById('predictions').innerHTML = '';

  try {
    const r = await fetch(API + '/predict/query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q, max_predictions: 5 })
    });
    if (!r.ok) throw new Error((await r.json()).detail || 'API error');
    const data = await r.json();
    const preds = data.predictions || [];

    let html = '';
    preds.forEach((p,i) => {
      const conf = p.confidence * 100;
      const c = conf >= 70 ? 'var(--green)' : conf >= 50 ? 'var(--yellow)' : 'var(--red)';
      html += `<div class="prediction-card">
        <div class="statement"><strong>${i+1}.</strong> ${p.statement}</div>
        <div class="bar-container"><div class="bar-fill" style="width:${conf}%;background:${c}"></div></div>
        <div class="meta">
          <span style="color:${c}">CONFIDENCE: ${conf.toFixed(0)}%</span>
          <span>[${p.category}]</span>
          ${p.deadline ? '<span>DEADLINE: '+p.deadline.slice(0,10)+'</span>' : ''}
          <span>ID: ${p.id.slice(0,8)}</span>
        </div>
        ${p.reasoning ? `<div class="reasoning">${p.reasoning.slice(0,250)}</div>` : ''}
      </div>`;
    });
    document.getElementById('predictions').innerHTML = html || '<div style="color:var(--dim);padding:1rem">No predictions generated. Try a different question.</div>';
    document.getElementById('question').value = '';
  } catch(e) {
    document.getElementById('error').textContent = '✗ ' + e.message;
    document.getElementById('error').style.display = 'block';
  }
  document.getElementById('spinner').style.display = 'none';
  btn.disabled = false; btn.textContent = '▸ CONSULT';
}

async function switchTab(tab) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  event.target.classList.add('active');

  if (tab === 'history') loadHistory();
  if (tab === 'calibration') loadCalibration();
}

async function loadHistory() {
  document.getElementById('histSpinner').style.display = 'block';
  try {
    const r = await fetch(API + '/predictions?limit=50');
    const data = await r.json();
    let html = '';
    (data.items||[]).forEach(p => {
      html += `<div class="history-item resolved-${p.status}">
        <span>${p.statement.slice(0,100)}</span>
        <span style="color:var(--dim)">[${p.category}] ${(p.confidence*100).toFixed(0)}% — ${p.status}</span>
      </div>`;
    });
    document.getElementById('historyList').innerHTML = html || '<div style="color:var(--dim);padding:1rem">No predictions yet.</div>';
  } catch(e) {}
  document.getElementById('histSpinner').style.display = 'none';
}

async function loadCalibration() {
  document.getElementById('calSpinner').style.display = 'block';
  try {
    const r = await fetch(API + '/calibration');
    const d = await r.json();
    const acc = (d.overall_accuracy||0)*100;
    const c = acc>=70?'var(--green)':acc>=50?'var(--yellow)':'var(--red)';
    let html = `<div style="font-size:2rem;text-align:center;padding:1rem;color:${c}">${acc.toFixed(1)}%</div>`;
    html += `<div style="text-align:center;color:var(--dim);margin-bottom:1rem">${d.overall_correct||0}/${d.overall_total||0} predictions correct</div>`;
    (d.buckets||[]).forEach(b => {
      const a = (b.accuracy||0)*100;
      html += `<div style="margin-bottom:0.5rem">
        <div style="display:flex;justify-content:space-between"><span>${b.confidence_range}</span><span>${b.correct}/${b.total} (${a.toFixed(0)}%)</span></div>
        <div class="bar-container"><div class="bar-fill" style="width:${a}%;background:${a>=70?'var(--green)':'var(--yellow)'}"></div></div>
      </div>`;
    });
    document.getElementById('calibrationData').innerHTML = html;
  } catch(e) {}
  document.getElementById('calSpinner').style.display = 'none';
}

// Load history on page load for the history tab (deferred)
</script>
</body>
</html>
