name: CI

# ============================================================================
# ACTIVATION REQUIRED — this file is parked at .github/ci-workflow.yml instead
# of .github/workflows/ci.yml because the OAuth token used to open this PR
# lacks the `workflow` scope (GitHub blocks pushing workflow files without it).
# To activate CI, a maintainer with a `workflow`-scoped token runs:
#
#     git mv .github/ci-workflow.yml .github/workflows/ci.yml
#     git commit -m "ci: activate workflow" && git push
#
# The contents below are final and tested; only the path needs to change.
# ============================================================================

# Reproducibility is trust: a clean checkout must install and pass the full
# suite on every supported Python, on both Windows and Linux, for every push
# and pull request. A green check here is the public, machine-verifiable proof
# that `pip install -e ".[dev]" && pytest` works exactly as documented.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }} · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade pip tooling
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Editable install with dev extras
        run: pip install -e ".[dev]"

      - name: Run test suite
        env:
          # The suite runs fully in-process against a mock provider; no network,
          # no secrets. Pin a dummy endpoint so any accidental real-client build
          # fails loudly in code rather than reaching a live service.
          AZURE_OPENAI_ENDPOINT: "http://localhost:0/disabled-in-ci"
        run: pytest -q
